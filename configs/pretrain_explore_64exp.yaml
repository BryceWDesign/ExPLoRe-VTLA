wandb_meta:
  project: "ExPLoRe"
  entity: "utk-iccv23"
  name: "explore_64exp_token_cls_sparse"
  desc: "ExPLoRe 64-expert SOTA recipe: Token+CLS sparse, block 11 dispatch routing, entropy weight 5.0"

losses:
  use_head_loss: true
  use_decoder_loss: false          # NO pixel reconstruction (like v1)
  use_cls_loss: true
  head_loss_weight: 1.0
  pixel_loss_weight: 1.0
  cls_loss_weight: 0.4             # From v1 (proven optimal)
  loss_weighting_method: "literal"  # "literal" or "rlw"
  moe_weight_head_loss: true       # MoE weights token distillation
  moe_weight_pixel_loss: false     # N/A - no pixel loss
  moe_head_loss_block: 11          # Use block 11 routing weights for head loss
  moe_normalize_weights: true      # Normalize weights to prevent degenerate solutions
  moe_normalize_per_image: true    # Normalize per-image (true) or per-batch (false). Per-image is more stable (recommended)
  moe_weight_type: "dispatch"      # "combine" or "dispatch" - which routing weights to use for loss
  use_importance_loss: false       # No importance loss
  importance_loss_weight: 0.1      # Dormant default (not used since use_importance_loss=false)
  use_dispatch_entropy_loss: true  # Enable dispatch entropy loss
  dispatch_entropy_loss_weight: 5.0  # Optimized: 2-expert sweep showed E=0.5 > E=5.0 (+0.092% KNN)
  moe_entropy_weight_type: "dispatch"  # Which weights to use for entropy loss: "dispatch" (recommended) or "combine"
  moe_regularize_all_blocks: false   # Only regularize last block (backward compatible)
  moe_regularize_all_experts: false  # Only regularize expert 0 (loss-weighting expert), let others specialize
  moe_entropy_aggregation: "separate" # Apply independently to each expert (recommended)
  moe_loss_expert_indices: [0]  # Which experts to use for MoE dynamic loss weighting
  use_combine_entropy_loss: false  # No combine entropy (proven harmful in 2-expert experiments)
  head:
    type: "smooth_l1"
    beta: 1.0
  decoder:
    type: "l2"
  cls:
    type: "cosine"                # From v1 (better than cross_entropy)
    temperature: 1.0
  decoder_norm_pix_loss: true
  normalize_targets: true
  normalize_predictions: false
  normalization_method: "variance"

model:
  student:
    name: "vit_base_patch16"
    img_size: 224
    patch_size: 16
    embed_dim: 768
    depth: 12
    num_heads: 12
    drop_path_rate: 0.1
    init_values: 0.1
    use_abs_pos_emb: true
    use_rel_pos_bias: false
    use_shared_rel_pos_bias: false
    use_mask_tokens: false
    use_soft_moe: true
    moe_num_experts: 64
    moe_slots_per_expert: 1
    moe_mlp_ratio: 4.0
    moe_placement: "alternating"
  teacher:
    name: "ViT-B/16"
    embed_dim: 768
  decoder:
    decoder_embed_dim: 512
    decoder_depth: 8
    decoder_num_heads: 16
    replace_mask_tokens: true
    use_sincos_pos_emb: true

data:
  batch_per_gpu: 512              # Full training with larger batch (effective: 2048 with 4 GPUs)
  num_workers: 16
  data_path: "/lustre/isaac24/proj/UTK0256/datasets/imagenet"
  train_dir: "/lustre/isaac24/proj/UTK0256/datasets/imagenet/train"
  val_dir: "/lustre/isaac24/proj/UTK0256/datasets/imagenet/val"
  subset: null # Full dataset (all images)
  subset_start: 0
  augmentation:
    min_scale: 0.2
    max_scale: 1.0
    horizontal_flip_prob: 0.5
    color_jitter: 0.4

mask:
  mask_ratio: 0.40
  mask_type: "block"
  shuffle_patches: false

optim:
  lr: 1.5e-3
  wd: 0.05
  betas: [0.9, 0.999]
  layer_decay: 1.0
  accum_iter: 1  # Gradient accumulation steps (1 = no accumulation)
  grad_clip: 3.0

schedule:
  min_lr: 1.0e-5
  warmup_epochs: 10
  warmup_start_lr: 1.0e-5

visualizations:
  enable: true
  layers_to_analyze: [0, 5, 11]
  attention_heads_to_show: 4
  plots:
    raw_attention: false
    layer_evolution: true
    head_comparison: true
    attention_rollout: false

epochs: 300
cpu: false
seed: 42
precision: "bf16"
log_interval: 25
output_dir: "output/pretrain_explore_64exp"
resume_path: null

# Those will get overwritten by the submit script
gpu: 0
distributed: true
dist_backend: "nccl"
dist_url: "env://"
dist_on_itp: true
rank: 0
world_size: 4
local_rank: 0
